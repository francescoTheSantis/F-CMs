defaults:
  - commons
  - _self_
  
mode: local_federated

settings:
  n_rounds: ${trainer.max_epochs}
  local_epochs: 2
  num_threads: 1
  freezing: true
  patience: ${trainer.patience}

  mia: False
  canary_fraction: 0.5
  k_plus: 0.333333
  k_min: 0.333333
  delta: 1e-5
  n_canaries: -1  # This will be set dynamically in utils.py based on the dataset size

  sia: True
  sia_samples_per_client: 30

  dra: False
  dra_samples_per_loader: 30

  # Read-only empirical diagnostic for Assumption (S3). When enabled, every
  # measured round makes a full pass over each active client's training data at
  # the broadcast model before local optimization.
  gradient_alignment:
    enabled: false
    every_n_rounds: 1
    rounds: null
    max_batches: null
    include_module_metrics: true
    eps: 1.0e-12
    output_dir: results
