defaults:
  - default
  - _self_

# useless for the centralized
client_id: 1

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 1 #, 2, 3, 4, 5
      model: blackbox 
      dataset: asia, sachs, alarm, insurance, hailfinder
      learning: centralized
      
model:
  hidden_size: 64

dataset:
  load_embeddings: false
  load_graph: false
  load_true_graph: true
  batch_size: 512
  autoencoder:
   noise: 0.5  # for bndatasets only

engine:
  intervention_prob: 0.8
  test_interv_noise: 0.8   # for bndatasets only
  optim_kwargs:
    lr: 0.00075

trainer:
  #logger: wandb
  max_epochs: 1
  patience: 40

rag:
  verbose: false

notes: test_run