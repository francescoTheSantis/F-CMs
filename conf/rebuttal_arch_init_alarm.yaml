defaults:
  - default
  - override dataset: alarm
  - override learning: local_federated
  - override causal_discovery: ges
  - _self_

client_id: 3

hydra:
  mode: MULTIRUN
  sweep:
    dir: "outputs/architecture_init_ablation/alarm/${now:%Y-%m-%d}/${now:%H-%M-%S}"
    subdir: "${hydra.job.num}"
  sweeper:
    params:
      seed: 1,2,3,4,5
      dataset: alarm
      model: cgm,c2bm
      learning: local_federated
      learning.subgraphs.architecture_update_strategy: full_reinit,partial_random,partial_zero
      learning.subgraphs.client_selection_mode_predrift: first_no_add,all_no_add

architecture_ablation:
  enabled: true
  record_shift_snapshot: true
  pre_shift_window: 5
  post_peak_window: 5
  smoothing_window: 5
  stability_window: 5
  final_window: 5
  post_shift_horizon: null

model:
  concept_loss_weight: 0.8

dataset:
  load_embeddings: true
  load_graph: false
  load_true_graph: true
  batch_size: 512
  autoencoder:
    noise: 0.5

learning:
  subgraphs:
    min_number_subgraphs: 2
    max_number_subgraphs: 6
    randomly_eliminate_task_from_subgraphs: true
    dataset_client_multiplier: 2
    drift_add_nodes_ratio: 0.5
    client_selection_mode_predrift: first_no_add
    client_selection_mode_postdrift: all
    architecture_update_strategy: full_reinit
    structural_concept_coverage_ranges:
      first_no_add: [0.10, 0.50]
      all_no_add: [0.51, 0.75]
      all: [1.00, 1.00]
    structural_concept_coverage: null
    dict_subgraph_with_add_nodes:
      modality: at_least_one_parent_and_child
      number_add_nodes: 2
      number_subgraphs_add_nodes: 3
    rnd_drift: 10
    aggregate_graph:
      local_graphs: from_true_graph
      perc_clients_alterations: 0.1
      graph_alteration_prob: 0.1

engine:
  intervention_prob: 0.8
  test_interv_noise: 0.8
  optim_kwargs:
    lr: 0.01

trainer:
  devices: [0]
  deterministic: true
  max_epochs: 60
  # Federated early stopping starts at the drift round. A value larger than
  # the complete horizon guarantees equal-length curves for all strategies.
  patience: 61

rag:
  verbose: false

notes: rebuttal_architecture_initialization_ablation
