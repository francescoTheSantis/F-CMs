defaults:
  - default
  - _self_

client_id: 3

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 1
      # possible datsets are: asia, sachs, alarm, hailfinder, insurance
      dataset: asia
      # possible models are:
      # blackbox, blackbox_multi, cbm_linear, cbm_mlp, cem, cgm, c2bm
      model: blackbox, cbm_linear
      learning: local_federated
      
model:
  hidden_size: 32
  concept_loss_weight: 0.8

dataset:
  load_embeddings: true
  load_graph: false
  load_true_graph: true
  batch_size: 512
  autoencoder:
   noise: 0.5  # for bndatasets only

combined_datasets:
  other_datasets: Null
  common_task: color
  fashionmnist:
    load_embeddings: true

engine:
  intervention_prob: 0.8
  test_interv_noise: 0.8   # for bndatasets only
  optim_kwargs:
    lr: 0.00075

trainer:
  # logger: wandb
  devices: [0]
  max_epochs: 200 #200
  patience: 40 #40

rag:
  verbose: false

notes: test_run
