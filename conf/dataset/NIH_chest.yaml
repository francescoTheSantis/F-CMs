defaults:
  - commons
  - _self_

name: NIH_chest
loader:
    _target_: src.data.datasets.NIH_chest.NIHChestDataset
    modality: tabular  # image / tabular
    val_size: 0.1
    ftune_size: 0.      # 0.3
    ftune_val_size: 0.  # 0.1

batch_size: 64

autoencoder:
  noise: 0.
  latent_dim: 32
  lr: 0.0005
  epochs: 2000
  batch_size: 512
  patience: 50

is_image_dataset: no # change it if tabular
reduce_fraction: Null

load_embeddings: true
