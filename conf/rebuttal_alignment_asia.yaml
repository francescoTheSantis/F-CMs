defaults:
  - default
  - override dataset: asia
  - override model: cbm_mlp
  - override learning: local_federated
  - override causal_discovery: ges
  - _self_

# Dedicated static run for the empirical Assumption (S3) diagnostic.
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 1,2,3

dataset:
  load_embeddings: true
  load_graph: false
  load_true_graph: true
  batch_size: 512
  autoencoder:
    noise: 0.5

model:
  concept_loss_weight: 0.8

learning:
  n_clients: 10
  subgraphs:
    min_number_subgraphs: 2
    max_number_subgraphs: 6
    randomly_eliminate_task_from_subgraphs: true
    # All ten measured clients cycle through all generated supervision
    # subgraphs; no second (post-drift) client pool is created.
    dataset_client_multiplier: 1
    drift_add_nodes_ratio: 0.5
    dict_subgraph_with_add_nodes:
      modality: at_least_one_parent_and_child
      number_add_nodes: 2
      number_subgraphs_add_nodes: 1
    # The post-drift configuration is active before round 1 and then remains
    # fixed, so there is no change during the measured trajectory.
    rnd_drift: 0
    aggregate_graph:
      local_graphs: none
      perc_clients_alterations: 0.0
      graph_alteration_prob: 0.0
  settings:
    local_epochs: 1
    freezing: true
    patience: ${trainer.patience}
    mia: false
    sia: false
    dra: false
    gradient_alignment:
      enabled: true
      every_n_rounds: 1
      rounds: null
      max_batches: null
      include_module_metrics: true
      eps: 1.0e-12
      output_dir: results

engine:
  optim_class:
    _target_: hydra.utils.get_class
    path: torch.optim.SGD
  optim_kwargs:
    lr: 0.01
  intervention_prob: 0.0
  test_interv_noise: 0.0

trainer:
  devices: [0]
  max_epochs: 30
  patience: 30

notes: rebuttal_gradient_alignment_asia
