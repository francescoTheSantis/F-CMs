client:
  resources:
    num_cpus: 2
    num_gpus: 0.0
  object:
    _target_: src.client.FlowerClient
    cfg:
      model: ${model}
      optim:
        _target_: torch.optim.SGD
        lr: 0.01
        momentum: 0.9
model:
  _target_: src.models.Net
  num_classes: ${dataset.num_classes}
strategy:
  _target_: flwr.server.strategy.FedAvg
  _recursive_: true
  fraction_fit: 0.0001
  fraction_evaluate: 0.0
  min_fit_clients: ${server.clients_per_round}
  min_available_clients: ${server.pool}
  on_fit_config_fn:
    _target_: src.server.gen_fit_config
    fit_cfg: ${server.fit_cfg}
dataset:
  name: CIFAR10
  num_classes: 10
  lda_alpha: 1.0
  prepare:
    _target_: src.datasets.get_cifar_10_and_partition
    config:
      pool: ${server.pool}
      alpha: ${dataset.lda_alpha}
      num_classes: ${dataset.num_classes}
      val: 0.1
server:
  pool: 100
  clients_per_round: 10
  num_rounds: 10
  fit_cfg:
    epochs: 1
    batch_size: 32
    num_cpu: ${client.resources.num_cpus}
misc:
  attach: false
